name: CodeQL

on:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SoplyraAI.sln

      - name: Build
        run: dotnet build SoplyraAI.sln -c Release --no-restore

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
