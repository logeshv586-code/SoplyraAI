name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'security/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Verify .NET SDK
        run: dotnet --version

      - name: Restore
        run: dotnet restore SoplyraAI.sln

      - name: Dependency vulnerability report
        run: dotnet list src/SoplyraAI.App/SoplyraAI.App.csproj package --vulnerable --include-transitive

      - name: Build
        run: dotnet build SoplyraAI.sln -c Release --no-restore

      - name: Publish self-contained EXE
        shell: pwsh
        run: ./build-exe.ps1

      - name: Smoke and security self-test
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "./dist/win-x64/SoplyraAI.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "SoplyraAI self-test failed with exit code $($p.ExitCode)" }

      - name: Install pinned Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $targets = @(
            "./dist/win-x64/SoplyraAI.exe",
            "./dist/SoplyraAI-Setup.exe"
          )
          $lines = foreach ($target in $targets) {
            if (-not (Test-Path $target)) { throw "Missing release artifact: $target" }
            $hash = Get-FileHash $target -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($target))"
          }
          $lines | Set-Content -Encoding ascii "./dist/SHA256SUMS.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SoplyraAI-Windows
          if-no-files-found: error
          path: |
            dist/win-x64/**
            dist/SoplyraAI-Setup.exe
            dist/SHA256SUMS.txt
