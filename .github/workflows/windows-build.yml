name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify .NET SDK
        run: dotnet --version
      - name: Restore
        run: dotnet restore SoplyraAI.sln
      - name: Build
        run: dotnet build SoplyraAI.sln -c Release --no-restore
      - name: Publish self-contained EXE
        shell: pwsh
        run: ./build-exe.ps1
      - name: Smoke test published application
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "./dist/win-x64/SoplyraAI.exe" -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "SoplyraAI self-test failed with exit code $($p.ExitCode)" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: SoplyraAI-Windows
          path: |
            dist/win-x64/**
            dist/SoplyraAI-Setup.exe
